      operationId: reportPdfGenerate
      x-required-permission: report:view
      x-data-scope: { mode: org, by-role: { ASSESSOR: org, ORG_ADMIN: org, SUPERVISOR: all } }
      x-sensitive-fields: [gradeCode, totalScore, dimensionScores, careItems]
      x-status: implemented
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: 生成结果（对象键、字节数、是否嵌入中文字体）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/R' }

  /api/v1/evaluation/reports/{reportNo}/pdf:
    get:
      tags: [report]
      summary: 下载报告 PDF
      description: |
        **读取/分发轴**（按报告编号）。本端点曾存在 P0 越权（CR-M2-006：无第二闸 + 服务直接读文件使第三闸失效 →
        任何已登录用户可跨机构下载任意报告全文），修复后两道闸均生效：
        ① 第二闸 `report:view`；② `read()` 先按 `report_no` 反查使得数据域行级过滤介入，
        跨机构/跨关系的编号统一落 `R.code=10004`（与「报告不存在」同码，不泄露存在性；HTTP 状态码仍为 200，见 responses）。
      operationId: reportPdfDownload
      x-required-permission: report:view
      x-data-scope:
        mode: relation
        by-role: { ELDER: self, ASSESSOR: org, FAMILY: relation, ORG_ADMIN: org, SUPERVISOR: all }
        via: elder_family_bind
        condition: "status=2 AND deleted=0 AND (auth_end_at IS NULL OR auth_end_at > NOW())"
        extra: 先查库后读文件（否则第三闸在文件路径上失效）
      x-sensitive-fields: [gradeCode, totalScore, dimensionScores, careItems, elderName]
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/ReportNo' }]
      responses:
        '200':
          description: |
            PDF 字节流（`application/pdf`）。
            ⚠ 本服务**业务异常一律返回 HTTP 200** + 统一响应体（`GlobalExceptionHandler#handleBiz` 无 `@ResponseStatus`，
            仅参数校验 400、未预期异常 500 才改状态码）。因此「报告不存在或无权访问」同样落在 200，
            客户端**必须判 `R.code`**（`10004`）、不能以 HTTP 状态码区分成败。
            对二进制端点尤须如此：响应体一旦是 `application/json`（而非 `%PDF-` 开头），即表示未拿到文件。
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { description: 凭据无效或已过期（`JwtAuthFilter` 置 401 + `R.code=10002`） }
        '403': { description: 未携带凭据（Spring Security 默认入口点，非统一响应体） }

  /api/v1/evaluation/assessments/{orderId}/care-plan:
    post:
      tags: [evaluation]
      summary: 生成照护方案（按等级匹配模板；无匹配降级通用建议）
      description: >-
        建议人取登录态；评估员持 `care:plan:edit:suggest`、机构管理员持 `care:plan:edit`，二者任一可生成。
        **D4-R7 R8（PM 裁决①）**：老人（ELDER）补授 `care:plan:edit:suggest`（种子 id 3041），
        可对**本人**评估单提交建议；写越权由第三闸兜底见 `x-data-scope`。
      operationId: carePlanGenerate
      x-required-permission: care:plan:edit | care:plan:edit:suggest
      x-data-scope:
        mode: org
        by-role: { ELDER: self, ASSESSOR: org, ORG_ADMIN: org }
        via: care_plan.elder_id
        note: >-
          ELDER 虽持 2008，但写入入口 `CarePlanService.generate` 先经 `reportService.findReport(orderId)`
          的 `selectOne` —— 该查询同受第三闸收口 ⇒ 他人报告查不到 ⇒ NOT_FOUND。
          即写越权边界由第三闸保证，服务层无需冗余归属校验。
      x-status: implemented
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: 方案, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }
    get:
      tags: [evaluation]
      summary: 查询照护方案
      operationId: carePlanGet
      x-required-permission: report:view | care:plan:edit | care:plan:edit:suggest
      x-data-scope:
        mode: org
        by-role: { ELDER: self, ASSESSOR: org, FAMILY: relation, ORG_ADMIN: org, SUPERVISOR: all }
        via: care_plan.elder_id
      x-sensitive-fields: [items]
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: 方案, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

  /api/v1/evaluation/assessments/{orderId}/care-plan/confirm:
    post:
      tags: [evaluation]
      summary: 确认照护方案（确认人取登录态，须 ≠ 建议人）
      operationId: carePlanConfirm
      x-required-permission: care:plan:edit
      x-data-scope: { mode: org, by-role: { ORG_ADMIN: org } }
      x-status: implemented
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: 方案, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

