        extra: 仅 status=1（已确认）的方案
      x-sensitive-fields: [items]
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/RelationId' }]
      responses:
        '200': { description: 方案, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

  # ======================= account（机构/人员管理，D-3） =======================
  /api/v1/account/orgs:
    get:
      tags: [account]
      summary: 机构列表
      description: 反向缺口 R6（`account:org:manage` / `:read`）；`Org` 实体已存在，仅缺控制器。
      operationId: orgList
      x-required-permission: account:org:manage | account:org:manage:read
      x-data-scope: { mode: org, by-role: { ORG_ADMIN: org, SUPERVISOR: all } }
      x-status: implemented
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/PageResult' }

  /api/v1/account/orgs/{orgId}:
    get:
      tags: [account]
      summary: 机构详情
      operationId: orgDetail
      x-required-permission: account:org:manage | account:org:manage:read
      x-data-scope: { mode: org, by-role: { ORG_ADMIN: org, SUPERVISOR: all } }
      x-status: implemented
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 详情, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

  # ======================= supervise（监管上报与导出，D-3） =======================
  /api/v1/supervise/exports:
    post:
      tags: [supervise]
      summary: 创建导出任务（≤5000 同步；>10000 走异步落地 COS；全留痕）
      operationId: superviseExportCreate
      x-required-permission: data:export
      x-data-scope:
        mode: org
        by-role: { ORG_ADMIN: org, SUPERVISOR: all }
        extra: 导出范围不得超过登录态数据域；`export_task` 按 operator_id 记录发起人，并新增可空机构锚列 `org_id`（D-3 裁决 1-A）以支撑机构级可见性
      x-second-verify: true
      x-sensitive-fields: [elderName, idCardMask, phone]
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exportType: { type: string, enum: [EVAL_LIST, REPORT, STAT] }
                format: { type: string, enum: [XLSX, PDF, CSV] }
                queryParams: { type: object, additionalProperties: true }
              required: [exportType, format]
      responses:
        '200':
          description: 任务已创建（返回 taskNo 与状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/R' }
        '400': { description: 超出单次上限（60001） }

  /api/v1/supervise/report:
    post:
      tags: [supervise]
      summary: 监管数据上报（支持重试 + 幂等）
      description: 上报成功时写 `retain_until`（归档任务据此清理，ER-14 / ADR-0004）。
      operationId: superviseReportSubmit
      x-required-permission: supervise:report:submit
      x-data-scope: { mode: org, by-role: { ORG_ADMIN: org, SUPERVISOR: all } }
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: 受理, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

  # ======================= system =======================
  /api/v1/system/health:
    get:
      tags: [system]
      summary: 健康检查（actuator 探针，含报告字体自检）
      operationId: systemHealth
      security: []
      x-required-permission: none
      x-data-scope: { mode: public }
      x-status: implemented
      responses:
        '200': { description: UP }
