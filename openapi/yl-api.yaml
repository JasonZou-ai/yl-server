      operationId: reportGet
      x-required-permission: report:view
      x-data-scope:
        mode: org
        by-role: { ELDER: self, ASSESSOR: org, FAMILY: relation, ORG_ADMIN: org, SUPERVISOR: all }
        via: elder_family_bind
      x-sensitive-fields: [gradeCode, totalScore, dimensionScores]
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: 报告详情, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

  /api/v1/evaluation/assessments/{orderId}/report/pdf:
    post:
      tags: [report]
