        condition: "elder_family_bind.elder_id IN (SELECT id FROM elder WHERE elder.user_id = 登录用户)"
        extra: 仅绑定关系中的老人本人可拒绝（经 elder.user_id 反查锚，★F1）
      x-status: implemented
      parameters:
        - name: id
