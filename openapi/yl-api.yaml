  # ======================= family（亲情绑定与家属端读取，D-4） =======================
  /api/v1/family/bindings:
    get:
      tags: [family]
      summary: 我的亲情绑定列表（家属侧）
      description: 绑定表自身按 `family_user_id` 过滤（**不可**按老人锚列：同为一位老人的其他家属绑定行不得可见）。
      operationId: familyBindingList
      x-required-permission: account:family:bind
      x-data-scope:
        mode: relation
        via: elder_family_bind
        condition: "FAMILY: family_user_id = 登录用户（本表自身过滤）；ORG_ADMIN: elder_family_bind.elder_id IN (SELECT id FROM elder WHERE elder.org_id IN (登录机构))"
        extra: 仅返回本人发起的绑定（含待审核/已生效/已解绑）；机构管理员经 elder.org_id 反查锚收口本机构（★F3）
      x-sensitive-fields: [elderName, proofCosKey]
      x-status: implemented
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/FamilyBindingView' }
    post:
      tags: [family]
      summary: 发起亲情绑定（家属侧）
      operationId: familyBindingCreate
      x-required-permission: account:family:bind
      x-data-scope:
        mode: relation
        extra: 写入前校验 elderId 存在且未与他人生效绑定；机构审核通过后 status=2
      x-sensitive-fields: [proofCosKey]
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyBindingCreate' }
      responses:
        '200':
          description: 绑定申请（status=0/1）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/FamilyBindingView' }

  /api/v1/family/bindings/{id}/approve:
    post:
      tags: [family]
      summary: 机构审核通过绑定
      description: 反向缺口 R3；PRD §4.2 绑定五步的「④ 机构审核」。
      operationId: familyBindingApprove
      x-required-permission: account:org:manage
      x-data-scope:
        mode: org
        by-role: { ORG_ADMIN: org }
        condition: "elder_family_bind.elder_id IN (SELECT id FROM elder WHERE elder.org_id IN (登录机构))"
        extra: 被审绑定须落在本机构域内（经 elder.org_id 反查锚，★F3）；权限码为 ORG_ADMIN 独占（★C1，原 account:family:bind 被 FAMILY 共享 → 可自我放行）
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

