          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

  /api/v1/family/bindings/{id}/unbind:
    post:
      tags: [family]
      summary: 解绑亲情关系（敏感：二次验证）
      description: |
        反向缺口 R2 落地。权限码 `account:family:unbind`（敏感点，不授予任何角色，由运行时二次验证临时提权）。
        实现采用 **OR 语义**：持 `account:family:bind` **或** `account:family:unbind` 任一即可 —— 所需码表**含敏感码** ⇒
        `PermissionAspect` 仍**强制第四闸**二次验证（缺 `X-Second-Verify-Token` → `10008`）。
      operationId: familyBindingUnbind
      x-required-permission: account:family:unbind
      x-data-scope:
        mode: relation
        via: elder_family_bind
        condition: "FAMILY: family_user_id = 登录用户；ORG_ADMIN: elder_family_bind.elder_id IN (SELECT id FROM elder WHERE elder.org_id IN (登录机构))"
        extra: 仅可解绑本人参与的绑定关系；机构管理员经 elder.org_id 反查锚收口本机构（★F3）
      x-second-verify: true
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

