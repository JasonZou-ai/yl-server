    post:
      tags: [family]
      summary: 老人侧拒绝亲情绑定
      description: 反向缺口 R4；权限码只给「拒绝」，不含「确认」——老人可不注册（PRD §2.1），放行由机构审核承载。
      operationId: familyBindingReject
      x-required-permission: account:family:bind:reject
      x-data-scope:
        mode: self
