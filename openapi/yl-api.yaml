openapi: 3.0.3
info:
  title: 银龄守护 · 统一 API（yl-server）
  version: 1.1.4
  description: |
    四端（微信小程序 / 抖音小程序 / iOS / 安卓）共用同一套 API，由后端统一供给
    （PRD YL-PRD-v1.2 §8「统一原则」）。

    ## 统一约定
    - **版本**：所有业务接口前缀 `/api/v1`，版本升级以新增路径而非破坏性修改实现。
    - **鉴权**：`Authorization: Bearer <accessToken>`；access 2h / refresh 14d（JWT 双令牌）。
      四端登录方式差异（微信/抖音授权、Apple ID/Face ID、账号密码）由 `/api/v1/auth/*` 统一换取 yl 自有令牌。
    - **统一响应（写测试前必读）**：HTTP 状态码只表达传输层语义；业务语义一律走响应体 `code`。
      `code=0` 成功，非 0 见「错误码字典」。**业务失败仍是 HTTP 200** —— 实现上
      `GlobalExceptionHandler#handleBiz` 未加 `@ResponseStatus`，全项目只有两类会改状态码：
      参数校验失败 → 400、未预期异常 → 500；鉴权链的未认证 → 401（凭据无效）/ 403（未携带凭据）。
      ⇒ 断言业务拒绝（越权 / 不存在）必须看 `R.code`，**不能看 HTTP 状态码**；
      反之拿 200 当「放行」证据是假绿。二进制端点（PDF）另需验魔数，见该操作 `responses` 说明。
    - **幂等**：写操作（提交评估、生成报告、上报、导出）必须携带 `Idempotency-Key`（客户端 UUID）；
      服务端按 key 去重，重复请求直接返回首次结果，不重复执行。
    - **分页**：`pageNum`（从 1 起）/ `pageSize`（1-100，默认 20）。
    - **脱敏**：手机号/身份证/姓名等敏感字段默认脱敏返回（如 `138****5678`），
      需查看明文须走 `/api/v1/security/reveal`（二次验证 + 留痕）。
    - **追踪**：响应体与响应头 `X-Trace-Id` 均返回 traceId，便于全链路排障。

    ## 契约口径（v1.1.0 起为强制项，由门禁机械化校验）
    每个操作**必须**声明下列扩展键；缺一即门禁变红（`scripts/verify-openapi.sh`
    ＋ `yl-bootstrap` 的 `OpenApiContractTest`，两者同源口径、互为冗余）。

    - `x-required-permission`：所需权限码。取值必须存在于 `sys_permission.perm_code`
      （该断言在 `scripts/verify-schema.sh`，因为需要连库）。多码用 ` | ` 分隔表示
      **任一满足**（OR 语义，对应 `@RequiresPermission(logical = Logical.OR)`）。
      不校验权限码的操作用 `none` —— 出现 `none` 的只有两类：
      ① `x-data-scope.mode = public`（会话入口 / 探针 / 扫码验真）；
      ② 需要登录但不校验权限码的会话相关端点（`/auth/second-verify`、`/auth/logout`）。
      `mode = public` 必须搭配 `none`（反之不成立）。
    - `x-data-scope`：第三闸（数据域）口径。
      - `mode` 取值域 `public | self | org | relation | all`：
        - `public`   无需登录，或无行级数据域（会话入口 / 健康探针 / 扫码验真）；
        - `self`     仅本人数据（按归属用户列过滤）；
        - `org`      本机构数据（`org_id IN (登录态所属机构)`）；
        - `relation` **关系级**：仅经 `elder_family_bind` **生效**绑定可达的老人（家属账号）；
        - `all`      字典类/规则类，无行级过滤（全角色可读）。
      - `mode` 取该端点在五角色下的**最窄**档位；各角色实际落点（若有差异）见可选键 `by-role`。
        例：`GET /elders` 对机构是 `org`、对家属是 `relation`、对监管是 `all` → `mode: relation` + `by-role` 列全。
      - 另三个可选键：`via`（关系级经哪张表收口）、`condition`（生效口径）、`extra`（业务附加约束）。
    - `x-second-verify: true`：第四闸（一次性凭据 `X-Second-Verify-Token`）强制。与
      `sys_permission.need_second_verify = 1` 的 **4 个敏感点**一一对应
      （`data:export` / `evaluation:order:void` / `account:family:unbind` / `data:reveal`）。
    - `x-status`：`implemented`（后端已有实现，须与代码端点**逐一对应**，门禁双向核对漂移）
      ｜ `planned`（目标态，待 D-2/D-3/D-4 子卡落地）。

    ## `reportNo` 与 `orderId` 的主从关系（避免两套报告契约）
    - `orderId`：**写入/主链路轴** —— 评估单创建、作答、提交、报告生成、照护方案。
    - `reportNo`：**读取/分发轴** —— PDF 下载、扫码验真；报告发布后对外可见的稳定标识。
    二者是同一资源的不同标识，不互为别名；契约不提供「按 reportNo 生成报告」这类跨轴操作。

    ## 鉴权链（四道闸）与本文档的对应
    `① 认证` → `② 授权`（`x-required-permission`）→ `③ 数据域`（`x-data-scope`）→ `④ 二次验证`（`x-second-verify`）。
    第三闸只作用于 SQL：**任何"绕过数据库直接读资源"的实现都会使第三闸失效**
    （CR-M2-006 即 `GET /evaluation/reports/{reportNo}/pdf` 直接读文件导致的跨机构下载越权，已修复并加回归断言）。

    ## 版本演进
    - **1.1.4**（2026-10-10）：**短信核身通道（P2-8-A）契约先行**。新增 4 个未登录前置操作
      （`SMS-01` 图形验证码 / `SMS-02` 发送 / `SMS-03` 校验 / `SMS-04` ticket 兑换登录态）+ 3 个响应 schema；
      并**订正** `POST /api/v1/auth/login/{channel}` 的 `channel` 枚举面（旧值 `PASSWORD/APPLE` 与实现
      `LoginChannel` 不符，属既有契约-实现漂移，本卡同批纠正为 `IOS/ANDROID` 并追加 `SMS`）。
    - **1.1.1**（2026-09-24）：**错误语义口径勘误**（不改实现，只把契约改准）。CR-M2-006 验收时发现契约
      误写「跨机构 reportNo 返回 404」，实际全站业务异常为 HTTP 200 + `R.code=10004`；已把
      `GET /evaluation/reports/{reportNo}/pdf` 的 responses 改为 `200 / 401 / 403` 并写明判 `code` 的口径，
      同时把「统一响应」一节写死（业务失败=200；仅校验 400 / 未预期 500）。相应修正
      `scripts/smoke-report-review-chain.sh` 的断言层级（原按 HTTP 状态码断言会得到假红 + 一条假绿）。
    - **1.1.0**（2026-09-24）：契约向实现对齐（A 类 9 项）；补登实现侧未登记端点（C 类 9 项，含复核三端点/照护方案/
      报告 PDF/题库）；引入 `x-data-scope` / `x-sensitive-fields` / `x-status` 扩展键与 4 条门禁断言；
      家属端 F1~F9 契约先行（D-1 裁决，路径统一为 `/family/bindings/{relationId}/...`）。
    - **1.0.0**（2026-09-18）：首版（C1/C3 业务闭环）。
servers:
  - url: http://localhost:8080
    description: 本地开发（docker-compose 一键启动）
  - url: https://api.yl.example.com
    description: 生产（示例域名）

tags:
  - name: auth
    description: 认证与令牌
  - name: elder
    description: 老人档案与敏感字段
  - name: evaluation
    description: 评估任务、评估单、分级与复核
  - name: rule
    description: 国标分级规则
  - name: report
    description: 评估报告与验真
  - name: family
    description: 亲情绑定与家属端读取
  - name: supervise
    description: 监管上报与导出
  - name: sms
    description: 短信核身通道（图形验证码 / 发送 / 校验 / ticket 兑换，未登录前置）
  - name: system
    description: 系统

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一鉴权令牌（access token）

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
      description: 幂等键，客户端生成的 UUID；同一键重复提交只执行一次
    PageNum:
      name: pageNum
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: 评估单 id（雪花 id，见 ADR-0003）
    ReportNo:
      name: reportNo
      in: path
      required: true
      schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      description: 报告编号（读取/分发轴；做白名单校验防目录穿越）
    RelationId:
      name: relationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: 亲情绑定 id（家属端以绑定关系为资源轴；不是 elderId）

  schemas:
    R:
      type: object
      description: 统一响应包裹
      properties:
        code: { type: integer, description: 0=成功；非0=错误码 }
        message: { type: string }
        data: { nullable: true }
        traceId: { type: string }
        timestamp: { type: integer, format: int64 }
      required: [code, message, traceId]
    PageResult:
      type: object
      properties:
        list: { type: array, items: {} }
        total: { type: integer, format: int64 }
        pageNum: { type: integer }
        pageSize: { type: integer }
        pages: { type: integer }

    LoginRequest:
      type: object
      description: 登录请求体（渠道由路径 `{channel}` 承载，不再放在 body 内）
      properties:
        code:
          type: string
          description: 平台授权码（WECHAT / DOUYIN / APPLE）
        username: { type: string, description: 仅 PASSWORD 渠道 }
        password:
          type: string
          description: 仅 PASSWORD 渠道；服务端只比对 BCrypt 散列。dev 联调期 WECHAT/DOUYIN 可携口令走降级分支（CR-M2-004）
        deviceType:
          type: string
          enum: [WXMP, DYMP, IOS, ANDROID, WEB]
        deviceId: { type: string }
      required: [deviceType]
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 秒 }
        userId: { type: integer, format: int64 }
        roles: { type: array, items: { type: string } }
        orgId: { type: integer, format: int64, nullable: true }
        channelDowngrade:
          type: boolean
          description: 是否走了 dev 渠道降级分支（CR-M2-004 审计标记；生产恒为 false）

    ElderCreate:
      type: object
      properties:
        name: { type: string, description: 明文提交，服务端加密落库 }
        idCardNo: { type: string, description: 明文提交，服务端加密落库；禁止回显全文 }
        gender: { type: integer, enum: [0, 1, 2] }
        birthDate: { type: string, format: date }
        phone: { type: string }
        address: { type: string }
        orgId: { type: integer, format: int64, description: 缺省取登录态默认机构；显式传值须在本人机构域内 }
      required: [name]
    ElderView:
      type: object
      description: 敏感字段默认脱敏返回
      properties:
        id: { type: integer, format: int64 }
        elderNo: { type: string }
        name: { type: string, description: 脱敏，如 张* }
        idCardMask: { type: string, description: 如 5301**********1234 }
        phone: { type: string, description: 如 138****5678 }
        gender: { type: integer }
        age: { type: integer }
        orgId: { type: integer, format: int64 }
        status: { type: integer }

    FamilyBindingCreate:
      type: object
      description: |
        发起亲情绑定。**服务端要求 `elderName` / `idCardNo` 必填**（用于经 `name_hash` + `id_card_hash` 精确核验被绑老人；
        `required` 数组暂不改动以保持翻旗批次零语义变更，登记为契约待订正项）。二者**不落明文**。
      properties:
        elderId: { type: integer, format: int64, description: 被绑定老人；服务端校验存在且未解绑 }
        relation: { type: string, enum: [CHILD, SPOUSE, KIN, GUARDIAN] }
        verifyMethod: { type: string, enum: [SCAN, PHONE, FACE] }
        proofCosKey: { type: string, description: 监护关系证明对象键（敏感：仅留痕，不回显下载地址） }
        elderName: { type: string, description: 老人姓名（核验必填，服务端要求；不落明文，只算 name_hash 精确匹配） }
        idCardNo: { type: string, description: 老人身份证号（核验必填，服务端要求；不落明文，只算 id_card_hash 精确匹配） }
      required: [elderId, relation, verifyMethod]
    FamilyBindingView:
      type: object
      description: 绑定视图。**未生效阶段（status=0/1）不下发 `elderName`**（防枚举）；仅 `status=2` 下发脱敏名。
      properties:
        id: { type: integer, format: int64, description: 绑定关系 id（即 relationId） }
        elderId: { type: integer, format: int64 }
        elderName: { type: string, description: 脱敏（如 张*）；未生效阶段不下发（null） }
        relation: { type: string }
        status:
          type: integer
          description: 0-待确认 1-待机构审核 2-生效 3-已拒绝 4-已解绑/过期
        authStartAt: { type: string, format: date-time, nullable: true }
        authEndAt: { type: string, format: date-time, nullable: true, description: 到期自动解绑（PRD P04） }
        rejectReason: { type: string, nullable: true }
      required: [id, elderId, status]

    UserBindingRequest:
      type: object
      description: >-
        elder↔user 绑定入参（elderId 在 path，**不含**身份字段，**不含** authEndAt）。老人↔账号为 **1:1**
        （elder.uk_elder_user 唯一）；冲突一律返回 **10005**，绝不 500。有效期不在此承载（elder 表无 auth_end_at 列，零 DDL；
        合法承载为 elder_authorization ER-07，本卡明令不接 D4-R3）。
        **未知字段（如遗留客户端仍发送 authEndAt）被 Jackson 静默忽略并返回 code=0** —— 本工程未开
        FAIL_ON_UNKNOWN_PROPERTIES，故本 schema **刻意不加** additionalProperties: false，以免"契约收紧而实现仍返 200"
        造成契约≠实现（见 D4-R10）。
      properties:
        userId: { type: integer, format: int64, description: 目标 ELDER 账号 sys_user.id }
      required: [userId]
    UserBindingView:
      type: object
      properties:
        elderId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        boundAt: { type: string, format: date-time, description: 绑定时间（= elder.updated_at） }

    EvalOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string }
        elderId: { type: integer, format: int64 }
        assessorId: { type: integer, format: int64 }
        reviewerId: { type: integer, format: int64, nullable: true }
        ruleVersionId: { type: integer, format: int64 }
        totalScore: { type: number, nullable: true }
        gradeCode:
          type: string
          nullable: true
          enum: [GRADE_INTACT, GRADE_MILD, GRADE_MODERATE, GRADE_SEVERE, GRADE_TOTAL]
        gradeUpgraded: { type: boolean }
        upgradeReason: { type: string, nullable: true }
        status:
          type: string
          enum: [DRAFT, SUBMITTED, PUBLISHED, REJECTED, VOID, ARCHIVED]
        refuseCount: { type: integer }
    GradeResult:
      type: object
      properties:
        totalScore: { type: number }
        gradeCode: { type: string }
        gradeName: { type: string, description: 能力完好/轻度失能/中度失能/重度失能/完全失能 }
        upgraded: { type: boolean }
        upgradeReason: { type: string, nullable: true }
        dimensionScores:
          type: array
          items:
            type: object
            properties:
              dimensionCode: { type: integer }
              dimensionName: { type: string }
              rawScore: { type: number }
              maxScore: { type: number }
        ruleVersionId: { type: integer, format: int64 }

    SmsCaptchaImageResponse:
      type: object
      description: SMS-01 图形验证码响应。`captchaImage` 为 data URI（`data:image/png;base64,…`）。
      properties:
        captchaId: { type: string, description: 图形验证码标识（答案存 Redis，TTL 120s，一次性） }
        captchaImage: { type: string, description: PNG data URI }
        ttl: { type: integer, description: 有效期（秒），当前为 120 }
      required: [captchaId, captchaImage, ttl]
    SmsSendResponse:
      type: object
      description: |
        SMS-02 发送响应。★ 不含任何「该手机号是否已注册」信息（防手机号存在性枚举）：
        对已注册 / 未注册手机号，本响应体与 `R.code` 完全一致。
      properties:
        maskedPhone: { type: string, description: 脱敏手机号，如 138****8000 }
        ttl: { type: integer, description: 验证码有效期（秒），当前为 300 }
      required: [maskedPhone, ttl]
    SmsTicketResponse:
      type: object
      description: SMS-03 校验通过后的一次性登录凭据（携至 SMS-04 兑换令牌）。
      properties:
        ticket: { type: string, description: 一次性 ticket（Redis GETDEL，TTL 300s） }
        ticketTtl: { type: integer, description: ticket 有效期（秒），当前为 300 }
      required: [ticket, ticketTtl]

paths:
  # ======================= auth（会话入口，第二闸豁免） =======================
  /api/v1/auth/login/{channel}:
    post:
      tags: [auth]
      summary: 四端统一登录（渠道由路径承载）
      description: |
        各端以平台凭据换取 yl 统一令牌。`channel ∈ {WECHAT, DOUYIN, IOS, ANDROID, FACE, SMS}`。
        dev 联调期 WECHAT/DOUYIN 可携 `password` 走「渠道降级分支」（仍强制 BCrypt 比对，CR-M2-004）。
        ★ `SMS` 仅用于**登录日志口径**（`login_log.login_type = SMS`）；**短信登录不经本端点**，
        请走 `POST /api/v1/auth/login-by-ticket`（SMS-04，ticket 兑换）。在本端点传 `SMS` 返回 `R.code=20001`。
      operationId: authLogin
      security: []
      x-required-permission: none
      x-data-scope: { mode: public }
      x-status: implemented
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string, enum: [WECHAT, DOUYIN, IOS, ANDROID, FACE, SMS] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/TokenPair' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌
      operationId: authRefresh
      security: []
      x-required-permission: none
      x-data-scope: { mode: public }
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
              required: [refreshToken]
      responses:
        '200':
          description: 新的令牌对
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/TokenPair' }

  /api/v1/auth/second-verify:
    post:
      tags: [auth]
      summary: 换取二次验证一次性凭据（敏感操作前置）
      description: |
        敏感操作（导出 / 作废评估单 / 解绑亲情 / 查看明文）前调用。校验通过后返回一次性凭据，
        后续业务请求以 `X-Second-Verify-Token` 头携带；凭据一次性消费、300 秒有效（Redis GETDEL）。
      operationId: authSecondVerify
      x-required-permission: none
      x-data-scope: { mode: self }
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [SCAN, PHONE, FACE]
                  description: 二次验证方式
                credential:
                  type: string
                  description: 渠道凭据（联调期为配置口令；生产为短信/扫码/人脸渠道结果）
              required: [method, credential]
      responses:
        '200':
          description: 一次性凭据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          expiresIn: { type: integer, description: 有效期（秒），当前为 300 }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录（令牌加入黑名单）
      description: |
        退出登录（D-4 落地）。服务端将 access 令牌按 `sha256` 记入黑名单（TTL=令牌剩余有效期），
        并在请求体携带 `refreshToken` 时**同时**吊销该 refresh（双令牌同时失效）。
        access 黑名单键 `yl:bl:at:<sha256(token)>`；`JwtAuthFilter` 在 `parse` 成功后命中黑名单即 **401 + `R.code=10002`**。
        **无权限码**（会话出口；安全边界 = 登录态本身，非权限矩阵某一格）。
      operationId: authLogout
      x-required-permission: none
      x-data-scope: { mode: self }
      x-status: implemented
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: 可选；携带则同时吊销该 refresh 令牌 }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/R' } } } }

  /api/v1/auth/login-by-ticket:
    post:
      tags: [sms]
      summary: SMS-04 以短信核身 ticket 兑换登录态
      description: |
        短信校验（SMS-03）通过后签发的一次性 ticket 换取 yl 统一令牌。ticket **GETDEL 一次性**消费
        （缺失/过期/重放 → `20008`）；按 `phone_hash` 查 `sys_user`，**未命中返回 `20009`，绝不自动建号**
        （新账号角色归属为产品决策）。命中则复用既有双令牌签发，写 `login_log`（`login_type=SMS`，
        `device_type=scene 映射` WXMP/DYMP/IOS/ANDROID，兜底 WEB）。
      operationId: authLoginByTicket
      security: []
      x-required-permission: none
      x-data-scope: { mode: public }
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket: { type: string, description: SMS-03 返回的一次性凭据 }
                scene:
                  type: string
                  enum: [WECHAT, DOUYIN, IOS, ANDROID]
                  description: 端侧场景（用于 device_type 映射；缺失时取 ticket 内场景，再兜底 WEB）
              required: [ticket]
      responses:
        '200':
          description: 登录结果（未命中用户为 `20009`，凭据无效为 `20008`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/TokenPair' }

  # ======================= sms（短信核身通道，未登录前置，P2-8-A） =======================
  /api/v1/sms/captcha-image:
    post:
      tags: [sms]
      summary: SMS-01 获取图形验证码
      description: |
        生成 4 位数字图形验证码（JDK AWT，含干扰线/噪点），答案存 `yl:sms:captcha:{captchaId}`（TTL 120s，GETDEL 一次性）。
        触发条件见 SMS-02 的图形验证前置判定（同手机号 1h≥3 或 同 IP 1h≥10）。
      operationId: smsCaptchaImage
      security: []
      x-required-permission: none
      x-data-scope: { mode: public }
      x-status: implemented
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scene: { type: string, description: 图形验证码用途场景标签（缺省 sms_send） }
      responses:
        '200':
          description: 图形验证码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/SmsCaptchaImageResponse' }

  /api/v1/sms/send:
    post:
      tags: [sms]
      summary: SMS-02 发送短信验证码
      description: |
        顺序即安全性：参数校验（`10001`）→ 计算 `phone_hash`（此后不再用明文手机号做键）→ 频控（超限 `10429`，**此处不查库**）
        → 锁定检查（`yl:sms:err` ≥5 → `10429`）→ 图形验证触发判定（需验证未携带 `20004` / 不通过 `20005`）
        → 生成 6 位码存 Redis（`sha256(code)`，TTL 300s）→ 下发（通道不可用 `20007`，fail-closed）。
        ★ 防枚举：对已注册 / 未注册手机号，响应体与 `R.code` 完全一致，且实现路径不查库。
      operationId: smsSend
      security: []
      x-required-permission: none
      x-data-scope: { mode: public }
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, description: 手机号（服务端转 phone_hash，明文不入库/不入日志） }
                purpose: { type: string, enum: [LOGIN, BIND, CHANGE_PHONE] }
                scene: { type: string, enum: [WECHAT, DOUYIN, IOS, ANDROID] }
                captchaId: { type: string, description: 触发图形验证时必填 }
                captchaCode: { type: string, description: 用户填写的图形验证码 }
              required: [phone, purpose, scene]
      responses:
        '200':
          description: 发送结果（通道不可用为 `20007`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/SmsSendResponse' }

  /api/v1/sms/verify:
    post:
      tags: [sms]
      summary: SMS-03 校验短信验证码（一次性核销）
      description: |
        Lua 原子「比对并焚毁」：不存在/不匹配 → 失败计数 +1（≥5 锁 900s → `10429`）→ `20006`
        （错误与过期同码，防探测）；匹配 → 已 DEL（一次性核销）→ 签发一次性 ticket（TTL 300s）。
      operationId: smsVerify
      security: []
      x-required-permission: none
      x-data-scope: { mode: public }
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                purpose: { type: string, enum: [LOGIN, BIND, CHANGE_PHONE] }
                code: { type: string, description: 短信验证码 }
                scene: { type: string, enum: [WECHAT, DOUYIN, IOS, ANDROID] }
              required: [phone, purpose, code, scene]
      responses:
        '200':
          description: 校验结果（失败为 `20006`，锁定为 `10429`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/SmsTicketResponse' }

  # ======================= elder（老人档案） =======================
  /api/v1/elders:
    post:
      tags: [elder]
      summary: 新建老人档案
      description: |
        家属侧走代办申请（`elder:archive:create:apply`），建档由评估员/机构管理员落库。
        `orgId` 可省略，缺省取登录态默认机构；显式传值须落在本人机构域内。
      operationId: elderCreate
      x-required-permission: elder:archive:create
      x-data-scope:
        mode: org
        by-role: { ELDER: self, ASSESSOR: org, FAMILY: org, ORG_ADMIN: org, SUPERVISOR: all }
        extra: 归属机构缺省取登录态默认机构；显式传值须落在本人机构域内
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ElderCreate' }
      responses:
        '200':
          description: 创建结果（返回脱敏视图）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/ElderView' }
    get:
      tags: [elder]
      summary: 老人列表（分页 + 多维筛选）
      description: |
        「权限码全角色授予、可见范围由第三闸控制」（CR-M2-001 对 `elder:archive:read` 的既定裁决）。
        家属为关系级：仅返回经 **生效** 绑定可达的老人（`elder.id IN (我绑定的 elder_id)`）。
        批量拉档风险由 `ArchiveAccessRateGuard` 行为异常检测兜底。
      operationId: elderList
      x-required-permission: elder:archive:read
      x-data-scope:
        mode: relation
        by-role: { ELDER: self, ASSESSOR: org, FAMILY: relation, ORG_ADMIN: org, SUPERVISOR: all }
        via: elder_family_bind
        condition: "status=2 AND deleted=0 AND (auth_end_at IS NULL OR auth_end_at > NOW())"
      x-status: implemented
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: orgId
          in: query
          schema: { type: integer, format: int64 }
        - name: keyword
          in: query
          description: 姓名/档案号模糊检索（服务端按 hash 列匹配）
          schema: { type: string }
        - name: status
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/ElderView' }

  /api/v1/elders/{elderId}:
    get:
      tags: [elder]
      summary: 老人档案详情（脱敏）
      operationId: elderDetail
      x-required-permission: elder:archive:read
      x-data-scope:
        mode: relation
        by-role: { ELDER: self, ASSESSOR: org, FAMILY: relation, ORG_ADMIN: org, SUPERVISOR: all }
        via: elder_family_bind
        condition: "status=2 AND deleted=0 AND (auth_end_at IS NULL OR auth_end_at > NOW())"
      x-sensitive-fields: [name, idCardMask, phone, address]
      x-status: implemented
      parameters:
        - name: elderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/ElderView' }

  /api/v1/elders/{elderId}/user-binding:
    post:
      tags: [elder]
      summary: 绑定老人本人登录账号（elder↔user，机构侧）
      description: |
        D-4 新增（R1 承载点）。机构管理员把某 ELDER 账号绑定为该 `elder` 的**本人**账号（写 `elder.user_id`）。
        本期**只写 `elder.user_id`**，不碰 `elder_authorization`（两者语义不同构：归属 vs 范围化授权）。
        三道显式校验：① 目标账号须属本机构（否则 `20003`）；② 该 `elder` 未被其他账号占用（否则 `10005`）；
        ③ `elder.org_id` 由第三闸按机构收口（越界/不存在 → `10004`）。`uk_elder_user` 冲突 → `10005`（**绝不 500**）。
      operationId: elderUserBinding
      x-required-permission: account:org:manage
      x-data-scope:
        mode: org
        by-role: { ORG_ADMIN: org }
        extra: 目标 elder 经第三闸 elder.org_id IN (myOrgs) 收口（越界 10004）；目标账号须属本机构（20003）
      x-status: implemented
      parameters:
        - name: elderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserBindingRequest' }
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - properties:
                      data: { $ref: '#/components/schemas/UserBindingView' }

  /api/v1/security/reveal:
    post:
      tags: [elder]
      summary: 查看敏感字段明文（二次验证 + 全留痕）
      description: 需 `X-Second-Verify-Token`（`POST /api/v1/auth/second-verify` 换取）；调用写入 `audit_log(sensitive=1)`。
      operationId: dataReveal
      x-required-permission: data:reveal
      x-data-scope:
        mode: org
        by-role: { ORG_ADMIN: org }
        extra: 仅机构管理员持有该权限点（敏感点，须二次验证）
      x-second-verify: true
      x-sensitive-fields: [name, idCardNo, phone, address]
      x-status: implemented
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bizType: { type: string, enum: [ELDER, USER] }
                bizId: { type: integer, format: int64 }
                fields: { type: array, items: { type: string } }
              required: [bizType, bizId, fields]
      responses:
        '200':
          description: 明文（调用方需自行做展示期防护）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/R' }

