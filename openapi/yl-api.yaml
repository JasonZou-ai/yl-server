        权限码为 **OR 语义**：`evaluation:order:review`（机构管理员常驻持有）**或**
        `evaluation:order:void`（敏感点，种子不授予任何角色，由运行时二次验证临时提权）。
        只要码表含敏感码，第四闸即强制要求 `X-Second-Verify-Token` —— 最终效力 = 机构管理员 + 二次验证。
