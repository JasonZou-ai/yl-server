# 本地开发环境（依赖 docker compose 拉起的中间件）
server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/yl_evaluation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:yl_root_2026}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: YlHikariPool
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:yl_redis_2026}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  sql:
    init:
      # 生产环境禁用；本地由 docker/mysql/init 负责初始化
      mode: never

# RocketMQ 本地 Namesrv
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: yl-server-producer
    send-message-timeout: 3000

mybatis-plus:
  configuration:
    # 本地打开 SQL 日志便于自检
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    cn.yl: DEBUG

# 本地 COS 默认关闭，避免无凭证时报错；需要联调时置 true 并注入密钥
yl:
  storage:
    cos:
      enabled: false
  # 短信核身通道（P2-8-A）：**仅本地联调**在日志打印验证码明文，便于跑通 SMS-03/04。
  #   ⚠️ 该开关不得出现在 application-prod.yml / 生产环境变量中（application.yml 中必须保持 false）。
  sms:
    dev-log-code: true
  # 开发期渠道降级（CR-M2-004）：**仅本地联调**开启，用于在微信/抖音平台授权渠道接入前跑通端侧主链。
  #   开启后 WECHAT/DOUYIN 携口令可走账密通道（服务端仍强制 BCrypt 比对），响应回 channelDowngrade=true。
  #   ⚠️ 该开关不得出现在 application-prod.yml / 生产环境变量中。
  auth:
    channel-downgrade:
      enabled: ${AUTH_CHANNEL_DOWNGRADE:true}
