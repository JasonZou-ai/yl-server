server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  shutdown: graceful

spring:
  application:
    name: yl-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.yl.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xxl:
  job:
    enabled: false
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8081/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:}
    executor:
      appname: yl-server-executor
      port: 9999

# 银龄守护业务配置
yl:
  security:
    jwt:
      issuer: yl-server
      # 生产环境必须由环境变量注入，禁止硬编码
      secret: ${JWT_SECRET:yl-dev-only-secret-please-change-in-prod-0123456789}
      access-token-ttl: 2h
      refresh-token-ttl: 14d
    # 敏感字段（身份证号等）加密密钥，生产由 KMS 注入
    sensitive-field-key: ${SENSITIVE_FIELD_KEY:}
  storage:
    # 对象存储：腾讯云 COS
    cos:
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:yl-dev-0000000000}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      # 评估报告 / 导出文件目录前缀
      prefix: yl/
  export:
    # 单次导出上限（超出走异步任务落地 COS），PRD「1 万条导出预留」
    max-sync-rows: 5000
    async-threshold-rows: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  level:
    root: INFO
    cn.yl: INFO
    cn.yl.api.support: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
