server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  shutdown: graceful

spring:
  application:
    name: yl-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.yl.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xxl:
  job:
    enabled: false
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8081/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:}
    executor:
      appname: yl-server-executor
      port: 9999

# 银龄守护业务配置
yl:
  security:
    jwt:
      issuer: yl-server
      # 生产环境必须由环境变量注入，禁止硬编码
      secret: ${JWT_SECRET:yl-dev-only-secret-please-change-in-prod-0123456789}
      access-token-ttl: 2h
      refresh-token-ttl: 14d
    # 敏感字段（身份证号等）加密密钥，生产由 KMS 注入
    sensitive-field-key: ${SENSITIVE_FIELD_KEY:}
    # 等值检索摘要密钥（HMAC-SHA256），与加密密钥分离；两者都非空才装配 SensitiveFieldCodec
    sensitive-field-hash-key: ${SENSITIVE_FIELD_HASH_KEY:}
    # 敏感操作二次验证（四道闸·第四闸）
    second-verify:
      # 联调期比对口令；留空即「未配置」，一律拒绝二次验证（安全默认，防开箱绕过）
      dev-code: ${SECOND_VERIFY_DEV_CODE:}
    # 第三方平台登录（B2 / rpW1xZ）：app-id / app-secret 齐备才视为该渠道可用
    third-party:
      wechat:
        app-id: ${WECHAT_APP_ID:}
        app-secret: ${WECHAT_APP_SECRET:}
        # 以下 endpoint 留空即用平台默认地址；联调/沙箱可覆盖
        session-url: ${WECHAT_SESSION_URL:}
        token-url: ${WECHAT_TOKEN_URL:}
        phone-url: ${WECHAT_PHONE_URL:}
      douyin:
        app-id: ${DOUYIN_APP_ID:}
        app-secret: ${DOUYIN_APP_SECRET:}
        session-url: ${DOUYIN_SESSION_URL:}
        # 抖音手机号接口需平台单独授权；留空即「未配置」，携带 phoneCode 登录会被明确拒绝
        phone-url: ${DOUYIN_PHONE_URL:}
  storage:
    # 对象存储：腾讯云 COS
    cos:
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:yl-dev-0000000000}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      # 评估报告 / 导出文件目录前缀
      prefix: yl/
  export:
    # 单次导出上限（超出走异步任务落地 COS），PRD「1 万条导出预留」
    max-sync-rows: 5000
    async-threshold-rows: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  level:
    root: INFO
    cn.yl: INFO
    cn.yl.api.support: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
