server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  shutdown: graceful

spring:
  application:
    name: yl-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.yl.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xxl:
  job:
    enabled: false
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8081/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:}
    executor:
      appname: yl-server-executor
      port: 9999

# 银龄守护业务配置
yl:
  # 短信核身通道（P2-8-A）：A 段仅 dev 日志桩（provider=log），真实通道（tencent/aliyun）为 fail-closed。
  sms:
    # 应急停发开关（合规清单 F4）：false 时 SMS-02 直接 fail-closed，绝不静默成功
    enabled: true
    # log（缺省）| tencent | aliyun。A 段仅 log 可用；tencent/aliyun 装配 UnavailableSmsSender
    provider: log
    # ★ 是否在日志打印验证码明文：仅 application-dev.yml 置 true；生产必须为 false（门禁断言）
    dev-log-code: false
    code: { ttl-seconds: 300, length: 6 }
    ticket: { ttl-seconds: 300 }
    captcha: { ttl-seconds: 120, length: 4 }
    # 频控 / 锁定 / 图形验证触发阈值（设计 §4.3）
    limits:
      phone-60s: 1
      phone-1h: 5
      phone-1d: 10
      ip-1h: 30
      device-1d: 20
      captcha-phone-1h: 3
      captcha-ip-1h: 10
      err-lock: 5
      err-lock-ttl-seconds: 900
  # 开发期渠道降级（CR-M2-004）：平台授权渠道（WECHAT/DOUYIN）适配器未接入，端侧无法登录。
  #   开启后：上述渠道**携带口令**时改走账密校验通道（**仍强制 BCrypt 比对，绝不是免密**），并在响应回 channelDowngrade=true。
  #   口径：默认 false；**仅 application-dev.yml 覆盖为 true**；生产必须保持 false（上线前复核 dev 覆盖是否已移除）。
  #   未携口令的请求不触发降级，仍走原路径「渠道未配置 → 明确拒绝」，故不存在"报渠道名即放行"的绕过面。
  auth:
    channel-downgrade:
      enabled: ${AUTH_CHANNEL_DOWNGRADE:false}
  security:
    jwt:
      issuer: yl-server
      # 生产环境必须由环境变量注入，禁止硬编码
      secret: ${JWT_SECRET:yl-dev-only-secret-please-change-in-prod-0123456789}
      access-token-ttl: 2h
      refresh-token-ttl: 14d
    # 敏感字段（身份证号等）加密密钥，生产由 KMS 注入
    sensitive-field-key: ${SENSITIVE_FIELD_KEY:}
    # 等值检索摘要密钥（HMAC-SHA256），与加密密钥分离；两者都非空才装配 SensitiveFieldCodec
    sensitive-field-hash-key: ${SENSITIVE_FIELD_HASH_KEY:}
    # 敏感操作二次验证（四道闸·第四闸）
    second-verify:
      # 联调期比对口令；留空即「未配置」，一律拒绝二次验证（安全默认，防开箱绕过）
      dev-code: ${SECOND_VERIFY_DEV_CODE:}
    # 档案接口异常访问告警守卫（CR-M2-001 §2.5，PM 补充意见）
    #   口径：非护理角色对档案类接口（elder:archive:read）滑动 1 小时内调用 > threshold 次 → 写审计告警 + 通知监管角色
    archive-access-guard:
      # 总开关；关闭后完全不产生计数 I/O
      enabled: ${ARCHIVE_GUARD_ENABLED:true}
      # 处置模式：off=旁路｜audit=只留痕不通知（灰度期）｜alert=留痕+通知监管（默认，不拦截）
      #           enforce=留痕+通知+拒绝请求（须先变更契约，声明 429 与重试语义；默认不启用）
      # 未知值回落 alert（配置写错时保持监控强度，不静默关掉护栏）
      mode: ${ARCHIVE_GUARD_MODE:alert}
      # 阈值 N（超过即告警；≤0 视为未配置，守卫按未启用处理）
      threshold: ${ARCHIVE_GUARD_THRESHOLD:50}
      # 滑动窗口长度（分钟，非自然小时；≤0 或 >1440 回落默认 60）
      window-minutes: ${ARCHIVE_GUARD_WINDOW_MINUTES:60}
      # 监控角色码（逗号分隔）。ASSESSOR / ORG_ADMIN 为护理相关角色，默认不纳入；
      # 若 PM 后续要求纳入，只需改此配置，无需改码。
      monitored-roles: ${ARCHIVE_GUARD_MONITORED_ROLES:ELDER,FAMILY,SUPERVISOR}
      # 告警推送实现：logging=结构化日志（默认）；接入站内信/短信/告警平台时改为 remote 并注册新实现
      notifier: ${ARCHIVE_GUARD_NOTIFIER:logging}
    # 第三方平台登录（B2 / rpW1xZ）：app-id / app-secret 齐备才视为该渠道可用
    third-party:
      wechat:
        app-id: ${WECHAT_APP_ID:}
        app-secret: ${WECHAT_APP_SECRET:}
        # 以下 endpoint 留空即用平台默认地址；联调/沙箱可覆盖
        session-url: ${WECHAT_SESSION_URL:}
        token-url: ${WECHAT_TOKEN_URL:}
        phone-url: ${WECHAT_PHONE_URL:}
      douyin:
        app-id: ${DOUYIN_APP_ID:}
        app-secret: ${DOUYIN_APP_SECRET:}
        session-url: ${DOUYIN_SESSION_URL:}
        # 抖音手机号接口需平台单独授权；留空即「未配置」，携带 phoneCode 登录会被明确拒绝
        phone-url: ${DOUYIN_PHONE_URL:}
  storage:
    # 对象存储：腾讯云 COS
    cos:
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:yl-dev-0000000000}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      # 评估报告 / 导出文件目录前缀
      prefix: yl/
  # 评估报告 PDF（PRD P02 下载 PDF；渲染选型见 ADR-0006）
  report:
    pdf:
      # 落盘目录（MVP 本地存储；后续接 COS 时键名 report/<reportNo>.pdf 不变，仅替换写入实现）
      # 留空回退 ${java.io.tmpdir}/yl-reports
      dir: ${REPORT_PDF_DIR:}
      # 中文字体文件（PDF 内置字体无中文字形，必须嵌入 TTF/TTC）
      # 留空时按系统常见字体探测；探测失败则降级渲染（中文缺字形），不阻断业务
      font-path: ${REPORT_PDF_FONT:}
    # 二维码验真基址（扫码落到此地址，携带报告编号与内容摘要）
    qr-base-url: ${REPORT_QR_BASE_URL:https://yl.example.com/verify}
  export:
    # 单次导出上限（超出走异步任务落地 COS），PRD「1 万条导出预留」
    max-sync-rows: 5000
    async-threshold-rows: 10000
    # D-3 B9：导出落盘目录（MVP 本地存储；后续接 COS 时键名 export/<taskNo>.csv 不变，仅替换写入实现）
    # 留空回退 ${java.io.tmpdir}/yl-exports
    dir: ${EXPORT_DIR:}
    # D-3 B9：expire_at = now + N 天（只写值；清理语义整体排 P2-7，不新增 @Scheduled）
    expire-days: ${EXPORT_EXPIRE_DAYS:7}
  # 保留期清理链路（ADR-0004 唯一触发壳）：一次调度做五件事——ER-14 三方绑定到期物理删除 + ER-03 超期评估单归档封存
  #   + ER-03 超期监管上报只读封存（D5-D1）+ D4-R1 到期亲情绑定状态流转（D5-D3）+ P2-7 孤儿文件回收（D1-B 到期导出任务标记）
  retention:
    # 链路壳（yl-bootstrap RetentionChainScheduler）：四个动作分属 account / evaluation / supervise / archive 平级模块，壳只能在启动模块
    chain:
      enabled: ${RETENTION_CHAIN_ENABLED:true}
    # 链路触发 cron（Spring 6 位：秒 分 时 日 月 周），默认每天 03:15
    chain-cron: ${RETENTION_CHAIN_CRON:0 15 3 * * *}
    third-party:
      # 总开关；关闭后不再注册清理任务 bean
      enabled: ${THIRD_PARTY_PURGE_ENABLED:true}
      # 单批最大删除行数；单次触发最多 max-rounds 批（兜底防死循环）
      batch-size: ${THIRD_PARTY_PURGE_BATCH:500}
      max-rounds: ${THIRD_PARTY_PURGE_MAX_ROUNDS:20}
      # 干跑：只统计不删除（上线前核对影响面），不写审计
      dry-run: ${THIRD_PARTY_PURGE_DRY_RUN:false}
    # 评估单超保留期归档（ER-03：评估记录/报告 5 年）：publish 时写 retain_until，到期转 ARCHIVED 只读封存
    eval-archive:
      enabled: ${RETENTION_EVAL_ARCHIVE_ENABLED:true}
      batch-size: ${RETENTION_EVAL_ARCHIVE_BATCH:500}
      max-rounds: ${RETENTION_EVAL_ARCHIVE_MAX_ROUNDS:20}
      # 干跑：只统计不归档（上线前核对影响面）
      dry-run: ${RETENTION_EVAL_ARCHIVE_DRY_RUN:false}
    # 监管上报记录超保留期归档（ER-03：监管上报 5 年）：B10 写 retain_until，到期写 archived_at 只读封存（D-5 裁决 D5-D1）
    supervise-archive:
      enabled: ${RETENTION_SUPERVISE_ARCHIVE_ENABLED:true}
      batch-size: ${RETENTION_SUPERVISE_ARCHIVE_BATCH:500}
      max-rounds: ${RETENTION_SUPERVISE_ARCHIVE_MAX_ROUNDS:20}
      # 干跑：只统计不归档（上线前核对影响面）
      dry-run: ${RETENTION_SUPERVISE_ARCHIVE_DRY_RUN:false}
    # 亲情绑定授权到期流转（D4-R1）：auth_end_at 到期 status 2 → 4（只改状态、不碰 deleted；D-5 裁决 D5-D3）
    family-bind-expire:
      enabled: ${RETENTION_FAMILY_BIND_EXPIRE_ENABLED:true}
      batch-size: ${RETENTION_FAMILY_BIND_EXPIRE_BATCH:500}
      max-rounds: ${RETENTION_FAMILY_BIND_EXPIRE_MAX_ROUNDS:20}
      # 干跑：只统计不流转（上线前核对影响面）
      dry-run: ${RETENTION_FAMILY_BIND_EXPIRE_DRY_RUN:false}
    # 孤儿文件回收（P2-7）：保留期链路第 5 个动作。把存储根内已无 DB 引用的文件移入隔离目录 .trash（不 rm、可还原）。
    #   存储根**复用** yl.report.pdf.dir / yl.export.dir（不新增第二套根配置，防"扫的根 ≠ 写的根"漂移）。
    orphan-file:
      enabled: ${RETENTION_ORPHAN_FILE_ENABLED:true}
      # 每轮每根最多回收文件数 + 单次触发最大轮次（兜底防死循环）
      batch-size: ${RETENTION_ORPHAN_FILE_BATCH:500}
      max-rounds: ${RETENTION_ORPHAN_FILE_MAX_ROUNDS:20}
      # 干跑：只统计不回收（零移动；上线前核对影响面）
      dry-run: ${RETENTION_ORPHAN_FILE_DRY_RUN:false}
      # 隔离子目录名（相对各存储根）
      trash-subdir: ${RETENTION_ORPHAN_FILE_TRASH:.trash}
      # 导出任务到期标记（D1-B）：true 时才把 expire_at < now 的行置 status=4
      export-expire-mark: ${RETENTION_ORPHAN_FILE_EXPORT_MARK:true}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  level:
    root: INFO
    cn.yl: INFO
    cn.yl.api.support: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
