server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  shutdown: graceful

spring:
  application:
    name: yl-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.yl.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xxl:
  job:
    enabled: false
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8081/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:}
    executor:
      appname: yl-server-executor
      port: 9999

# 银龄守护业务配置
yl:
  security:
    jwt:
      issuer: yl-server
      # 生产环境必须由环境变量注入，禁止硬编码
      secret: ${JWT_SECRET:yl-dev-only-secret-please-change-in-prod-0123456789}
      access-token-ttl: 2h
      refresh-token-ttl: 14d
    # 敏感字段（身份证号等）加密密钥，生产由 KMS 注入
    sensitive-field-key: ${SENSITIVE_FIELD_KEY:}
    # 等值检索摘要密钥（HMAC-SHA256），与加密密钥分离；两者都非空才装配 SensitiveFieldCodec
    sensitive-field-hash-key: ${SENSITIVE_FIELD_HASH_KEY:}
    # 敏感操作二次验证（四道闸·第四闸）
    second-verify:
      # 联调期比对口令；留空即「未配置」，一律拒绝二次验证（安全默认，防开箱绕过）
      dev-code: ${SECOND_VERIFY_DEV_CODE:}
    # 档案接口异常访问告警守卫（CR-M2-001 §2.5，PM 补充意见）
    #   口径：非护理角色对档案类接口（elder:archive:read）滑动 1 小时内调用 > threshold 次 → 写审计告警 + 通知监管角色
    archive-access-guard:
      # 总开关；关闭后完全不产生计数 I/O
      enabled: ${ARCHIVE_GUARD_ENABLED:true}
      # 处置模式：off=旁路｜audit=只留痕不通知（灰度期）｜alert=留痕+通知监管（默认，不拦截）
      #           enforce=留痕+通知+拒绝请求（须先变更契约，声明 429 与重试语义；默认不启用）
      # 未知值回落 alert（配置写错时保持监控强度，不静默关掉护栏）
      mode: ${ARCHIVE_GUARD_MODE:alert}
      # 阈值 N（超过即告警；≤0 视为未配置，守卫按未启用处理）
      threshold: ${ARCHIVE_GUARD_THRESHOLD:50}
      # 滑动窗口长度（分钟，非自然小时；≤0 或 >1440 回落默认 60）
      window-minutes: ${ARCHIVE_GUARD_WINDOW_MINUTES:60}
      # 监控角色码（逗号分隔）。ASSESSOR / ORG_ADMIN 为护理相关角色，默认不纳入；
      # 若 PM 后续要求纳入，只需改此配置，无需改码。
      monitored-roles: ${ARCHIVE_GUARD_MONITORED_ROLES:ELDER,FAMILY,SUPERVISOR}
      # 告警推送实现：logging=结构化日志（默认）；接入站内信/短信/告警平台时改为 remote 并注册新实现
      notifier: ${ARCHIVE_GUARD_NOTIFIER:logging}
    # 第三方平台登录（B2 / rpW1xZ）：app-id / app-secret 齐备才视为该渠道可用
    third-party:
      wechat:
        app-id: ${WECHAT_APP_ID:}
        app-secret: ${WECHAT_APP_SECRET:}
        # 以下 endpoint 留空即用平台默认地址；联调/沙箱可覆盖
        session-url: ${WECHAT_SESSION_URL:}
        token-url: ${WECHAT_TOKEN_URL:}
        phone-url: ${WECHAT_PHONE_URL:}
      douyin:
        app-id: ${DOUYIN_APP_ID:}
        app-secret: ${DOUYIN_APP_SECRET:}
        session-url: ${DOUYIN_SESSION_URL:}
        # 抖音手机号接口需平台单独授权；留空即「未配置」，携带 phoneCode 登录会被明确拒绝
        phone-url: ${DOUYIN_PHONE_URL:}
  storage:
    # 对象存储：腾讯云 COS
    cos:
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:yl-dev-0000000000}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      # 评估报告 / 导出文件目录前缀
      prefix: yl/
  export:
    # 单次导出上限（超出走异步任务落地 COS），PRD「1 万条导出预留」
    max-sync-rows: 5000
    async-threshold-rows: 10000
  # 留存到期清理（ER-14 retain_until）：账号注销后三方绑定行保留 30 天，到期物理删除
  retention:
    third-party:
      # 总开关；关闭后不再注册清理任务 bean
      enabled: ${THIRD_PARTY_PURGE_ENABLED:true}
      # 触发 cron（Spring 6 位：秒 分 时 日 月 周），默认每天 03:15
      cron: ${THIRD_PARTY_PURGE_CRON:0 15 3 * * *}
      # 单批最大删除行数；单次触发最多 max-rounds 批（兜底防死循环）
      batch-size: ${THIRD_PARTY_PURGE_BATCH:500}
      max-rounds: ${THIRD_PARTY_PURGE_MAX_ROUNDS:20}
      # 干跑：只统计不删除（上线前核对影响面），不写审计
      dry-run: ${THIRD_PARTY_PURGE_DRY_RUN:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  level:
    root: INFO
    cn.yl: INFO
    cn.yl.api.support: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
