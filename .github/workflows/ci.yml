name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"

jobs:
  # ---------- 1) 格式与静态检查（PR 门禁，失败即阻断） ----------
  static-analysis:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Spotless(google-java-format AOSP) 校验：本地用 mvn spotless:apply 一键修复
      - name: Spotless 格式校验
        run: mvn -B -ntp spotless:check

      # Checkstyle(自定义规则: 禁 System.out/printStackTrace/java.util.Date 等)
      - name: Checkstyle 规则校验
        run: mvn -B -ntp -DskipTests checkstyle:check

      - name: SpotBugs 缺陷扫描
        run: mvn -B -ntp compile com.github.spotbugs:spotbugs-maven-plugin:4.10.4.1:check

  # ---------- 2) 编译 + 单元/集成测试 + 覆盖率 ----------
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译并执行测试（含 Testcontainers 集成测试）
        run: mvn -B -ntp verify -DskipCheckstyle=true

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

      - name: 上传 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore

  # ---------- 3) SonarQube 质量门禁（需配置 SONAR_TOKEN Secret） ----------
  sonarqube:
    name: SonarQube 质量扫描
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: SonarQube 扫描
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::未配置 SONAR_TOKEN，跳过 SonarQube 扫描"
            exit 0
          fi
          if [ -z "$SONAR_ORG" ]; then
            echo "::warning::未配置 SONAR_ORG，SonarCloud 需要 organization，跳过扫描"
            exit 0
          fi
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=JasonZou-ai_yl-server \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -DskipCheckstyle=true
