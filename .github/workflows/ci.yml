name: CI

on:
  # 分支命名兼容两种风格：斜杠式 `feature/<name>` 与连字符式 `feature-<name>`。
  # ⚠ GitHub 分支过滤的通配符 `*` **不匹配 `/`**，故 'feature/**' 无法命中
  #   'feature-b2-account-rbac'——曾导致推送该分支静默不触发 CI（只能绕道 PR）。
  #   故两种风格均显式列出；hotfix 同理。
  push:
    branches: [ main, develop, 'feature/**', 'feature-*', 'hotfix/**', 'hotfix-*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"

jobs:
  # ---------- 0) 提交信息规范（本地 .githooks/commit-msg 与 CI 复用同一份脚本，口径唯一） ----------
  commit-lint:
    name: 提交信息规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验提交信息（Conventional Commits）
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          fail=0
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi
          # 新分支的 before 为全零 SHA，此时退化为只校验 HEAD
          if git cat-file -e "${BASE}" 2>/dev/null; then
            SHAS=$(git log --format=%H "${BASE}..${HEAD_SHA}")
          else
            SHAS=$(git log -1 --format=%H "${HEAD_SHA}")
          fi
          for sha in ${SHAS}; do
            git log -1 --format=%B "${sha}" > /tmp/commit-msg.txt
            printf -- '--- %s | %s\n' "${sha}" "$(head -n 1 /tmp/commit-msg.txt)"
            sh ./.githooks/commit-msg /tmp/commit-msg.txt || fail=1
          done
          exit ${fail}

  # ---------- 1) 格式与静态检查（PR 门禁，失败即阻断） ----------
  static-analysis:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Spotless(google-java-format AOSP) 校验：本地用 mvn spotless:apply 一键修复
      - name: Spotless 格式校验
        run: mvn -B -ntp spotless:check

      # Checkstyle(自定义规则: 禁 System.out/printStackTrace/java.util.Date 等)
      - name: Checkstyle 规则校验
        run: mvn -B -ntp -DskipTests checkstyle:check

      # SpotBugs(字节码缺陷扫描, effort=Max/threshold=Medium, 版本由父 POM 统一管理)
      - name: SpotBugs 缺陷扫描
        run: mvn -B -ntp -DskipTests compile spotbugs:check

  # ---------- 2) DDL 落地验证（真实 MySQL 8 执行 init 脚本 + 结构与约束断言） ----------
  schema-verify:
    name: DDL 落地验证
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.37
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: 确保 mysql 客户端可用
        run: command -v mysql >/dev/null || { sudo apt-get update && sudo apt-get install -y mysql-client; }

      - name: 执行并校验 DDL（scripts/verify-schema.sh）
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: ""
        run: bash scripts/verify-schema.sh

  # ---------- 3) 编译 + 单元/集成测试 + 覆盖率 ----------
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译并执行测试（含 Testcontainers 集成测试）
        run: mvn -B -ntp verify -DskipCheckstyle=true -DskipSpotbugs=true

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

      - name: 上传 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore

  # ---------- 4) SonarQube 质量门禁（需配置 SONAR_TOKEN Secret） ----------
  sonarqube:
    name: SonarQube 质量扫描
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: SonarQube 扫描
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::未配置 SONAR_TOKEN，跳过 SonarQube 扫描"
            exit 0
          fi
          if [ -z "$SONAR_ORG" ]; then
            echo "::warning::未配置 SONAR_ORG，SonarCloud 需要 organization，跳过扫描"
            exit 0
          fi
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=JasonZou-ai_yl-server \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -DskipCheckstyle=true \
            -DskipSpotbugs=true
