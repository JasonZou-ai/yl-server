name: Build & Push Image

# main 合并后构建镜像并推送到镜像仓库；支持按 tag 发布与一键回滚（回滚 = 重新部署上一个 tag）
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '自定义镜像 tag（留空则用 git sha）'
        required: false

env:
  # 使用 GitHub Container Registry：凭据用内置 GITHUB_TOKEN，无需外部 Secret
  REGISTRY: ghcr.io
  IMAGE_NAME: yl-server

jobs:
  build-image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven 打包
        run: mvn -B -ntp -DskipTests -DskipCheckstyle=true clean package

      - name: 计算镜像 tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # GHCR 要求镜像路径全小写，github.repository_owner 可能含大写
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}:latest

      - name: 输出部署信息
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 回滚方式：部署上一个 tag 即可（镜像 tag 不可变）" >> "$GITHUB_STEP_SUMMARY"
